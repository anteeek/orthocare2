<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kontakt – OrthoCare</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="/dist/output.css" rel="stylesheet">
</head>
<body class="bg-white min-h-screen overflow-x-hidden">
  <header id="main-header"></header>
  <main class="w-full max-w-full overflow-x-hidden min-h-screen">
    <section class="w-full bg-white pb-12">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-16">
        <div class="text-center mb-16">
          <h1 class="text-4xl md:text-5xl font-bold text-brand-dark mb-4">Jesteśmy tu dla Ciebie</h1>
          <p class="text-xl text-gray-600 mb-8">Zadzwoń i umów się na konsultację</p>
          <div class="flex items-center justify-center">
            <a href="tel:889817012" class="text-3xl md:text-4xl font-bold text-brand-dark hover:underline">889 817 012</a>
          </div>
        </div>
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-12 items-start">
          <div>
            <img src="assets/clinic-exterior.jpg" alt="Budynek Kliniki OrthoCare" class="w-full h-[400px] md:h-[500px] object-cover rounded-2xl shadow-lg">
          </div>
          <div class="space-y-8">
            <div>
              <img src="assets/logo-header.png" alt="OrthoCare" class="h-12 mb-6">
            </div>
            <div>
              <h3 class="text-xl font-bold text-brand-dark mb-4">Rejestracja telefoniczna</h3>
              <p class="text-lg text-gray-700">poniedziałek–piątek, 8:00–18:00</p>
            </div>
            <div>
              <p class="text-lg text-gray-700">Radom, ul. Dębowa 2</p>
            </div>
            <div>
              <a href="https://maps.google.com/?q=ul.+Dębowa+2,+26-600+Radom" target="_blank"
                class="inline-flex items-center px-8 py-4 bg-brand text-white rounded-full hover:bg-brand-dark transition-colors font-semibold text-lg">
                Mapa dojazdu
              </a>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>
  <footer id="main-footer"></footer>
  <script src="js/main.js"></script>
  <script>
    fetch('index.html').then(r=>r.text()).then(html=>{
      const doc = new DOMParser().parseFromString(html, 'text/html');
      document.getElementById('main-header').innerHTML = doc.querySelector('header').outerHTML;
      document.getElementById('main-footer').innerHTML = doc.querySelector('footer').outerHTML;
      if (window.reinitMobileMenu) window.reinitMobileMenu();
    });
  </script>
</body>
</html>
